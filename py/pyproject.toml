[project]
name = "chessdex"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "fastapi", "uvicorn", "pydantic", "chess"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E702", "E731", "B905", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# çevrimdışı araştırma/veri hazırlama betikleri (uzun komut satırı örnekleri ve tablolar)
"chessdex/sim/*" = ["E501"]
"chessdex/bank/demo_gen.py" = ["E501"]
"chessdex/bank/positional.py" = ["E501"]
"chessdex/bank/maia_calib.py" = ["E501"]
